source_roots = ["."]
exclude = [".venv", "oldProjectData", "__pycache__"]

# Desired architecture: db has no upward dependencies.
# KNOWN VIOLATION: db.bigquery imports BigQueryError from src.exceptions,
# select_top_companies from src.post_selection, and is_valid_ticker from
# src.tickers.
# The last one is deliberate (PUL-102): the ticker-shape guard has to sit AT the
# write boundary, or a future upstream markup change bypasses it the way bankier's
# did. src/tickers.py is import-free, so it is the cheapest possible version of
# this violation.
# Fix: move BigQueryError to db/exceptions.py and the pure helpers to a shared
# leaf package (future change).

[[modules]]
path = "main"
depends_on = [
    { path = "src" },
    { path = "db" },
]

[[modules]]
path = "post_main"
depends_on = [
    { path = "src" },
    { path = "db" },
]

[[modules]]
path = "api_main"
depends_on = [
    { path = "src" },
    { path = "db" },
]

[[modules]]
path = "src"
depends_on = [
    { path = "db" },
]

[[modules]]
path = "db"
depends_on = [
    { path = "src" },  # SMELL: db imports BigQueryError from src.exceptions
]

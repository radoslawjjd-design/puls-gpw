name: Deploy

on:
  push:
    branches: [master]
    # A skipped deploy is only safe for paths that cannot change the image, and the
    # file that decides that is .dockerignore — which excludes context/ and, since
    # PUL-122, markdown. Keep the two in step: tests/test_deploy_workflow_filter.py
    # fails if an entry here is one Docker would still copy in.
    #
    # Deliberately a denylist. An allowlist would fail silent — a path nobody thought
    # of would stop deploying — where an unlisted path here merely deploys as before.
    #
    # tests/ is excluded from the image too, so skipping it would be sound, but it
    # stays deploying on purpose: deploy.yml's own suite run is the post-merge gate.
    paths-ignore:
      - 'context/**'
      - '**.md'

env:
  PROJECT_ID: puls-gpw
  REGION: europe-central2
  IMAGE: europe-central2-docker.pkg.dev/puls-gpw/puls-gpw/puls-gpw

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.puls_gpw_secret }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.13"

      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps

      - name: Run tests
        run: uv run pytest --tb=short

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-central2-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE_TAG="${{ env.IMAGE }}:${{ github.sha }}"
          docker build -t "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"

      - name: Update Cloud Run Job (scraper)
        run: |
          gcloud run jobs update puls-gpw \
            --image="${{ env.IMAGE }}:${{ github.sha }}" \
            --command=uv --args="run,--no-dev,python,main.py" \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }}

      - name: Update Cloud Run Job (post)
        run: |
          gcloud run jobs update puls-gpw-post \
            --image="${{ env.IMAGE }}:${{ github.sha }}" \
            --command=uv --args="run,--no-dev,python,post_main.py" \
            --update-secrets="X_API_KEY=x-api-key:latest,X_API_SECRET=x-api-secret:latest,X_ACCESS_TOKEN=x-access-token:latest,X_ACCESS_SECRET=x-access-secret:latest" \
            --update-env-vars="X_AUTO_PUBLISH=true,GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }},BIGQUERY_DATASET=espi_ebi" \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }}

      - name: Update Cloud Run Job (company-stats)
        run: |
          gcloud run jobs update puls-gpw-company-stats \
            --image="${{ env.IMAGE }}:${{ github.sha }}" \
            --command=uv --args="run,--no-dev,python,company_stats_main.py" \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }}

      - name: Update Cloud Run Job (etf-quotes)
        run: |
          gcloud run jobs update puls-gpw-etf-quotes \
            --image="${{ env.IMAGE }}:${{ github.sha }}" \
            --command=uv --args="run,--no-dev,python,etf_quotes_main.py" \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }}

      - name: Deploy Cloud Run Service (api)
        run: |
          # --concurrency was never passed, so the service ran at Cloud Run's
          # default of 80 requests per instance — a default, not a decision. The
          # broker import can hold ~50 MiB at once even with the reader's own
          # ceiling (PUL-105), and 80 x that does not fit in 512Mi.
          #
          # Measured idle footprint (interpreter + app) is ~85-100 MB, leaving
          # ~412 MiB for requests, so 4 x ~50 MiB keeps a real margin where 8
          # would have consumed the instance. max-instances rises to 4 in step,
          # holding total capacity at 16 — unchanged from 8 x 2 — and costing
          # nothing extra at rest, since min-instances stays 0.
          gcloud run deploy puls-gpw-api \
            --image="${{ env.IMAGE }}:${{ github.sha }}" \
            --command=uv --args="run,--no-dev,python,api_main.py" \
            --port=8080 \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --service-account=puls-gpw-runner@puls-gpw.iam.gserviceaccount.com \
            --set-secrets="ADMIN_API_KEY=admin-api-key:latest,USER_API_KEY=user-api-key:latest,JWT_SECRET=jwt-secret:latest,FIREBASE_SERVICE_ACCOUNT_JSON=firebase-service-account:latest,FIREBASE_WEB_API_KEY=firebase-web-api-key:latest,SMTP_HOST=smtp-host:latest,SMTP_PORT=smtp-port:latest,SMTP_USER=smtp-user:latest,SMTP_PASSWORD=smtp-password:latest,OWNER_EMAIL=owner-email:latest" \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }},BIGQUERY_DATASET=espi_ebi" \
            --allow-unauthenticated \
            --cpu=1 \
            --memory=512Mi \
            --min-instances=0 \
            --max-instances=4 \
            --concurrency=4 \
            --timeout=60
